<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>یادداشت روزانه</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #050b14, #0a192f);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
  }

  .card {
    width: 100%;
    max-width: 540px;
    background: #112240;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    border-top: 5px solid #1f4a7a;
    color: #e6f1ff;
  }

  h1 {
    text-align: center;
    color: #64ffda;
    margin-bottom: 14px;
    font-size: 1.2rem;
  }

  .field {
    margin-bottom: 12px;
  }

  label {
    display: block;
    margin-bottom: 4px;
    color: #a8b2d1;
    font-size: 0.8rem;
    font-weight: bold;
  }

  input, textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #233554;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
    transition: 0.2s;
    background: #0a192f;
    color: #ffffff;
  }

  select option, select optgroup {
    color: #ffffff;
    background-color: #0a192f;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #64ffda;
    box-shadow: 0 0 0 2px rgba(100, 255, 218, 0.15);
  }

  input::placeholder, textarea::placeholder {
    color: #495670;
  }

  textarea {
    resize: none;
    min-height: 60px;
  }

  .datetime {
    display: flex;
    gap: 8px;
  }

  .datetime .field {
    flex: 1;
    margin-bottom: 0;
  }

  .date-group {
    display: flex;
    gap: 6px;
  }

  .date-group select,
  .date-group input {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
  }

  .date-group select {
    cursor: pointer;
  }

  .date-preview {
    margin-top: 4px;
    font-size: 0.75rem;
    color: #64ffda;
    text-align: center;
    min-height: 14px;
  }

  /* استایل مشترک برای بخش‌های آکاردئونی */
  .accordion-section {
    background: #0a192f;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid #233554;
    overflow: hidden;
  }

  .accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer;
    background: #172a45;
    transition: 0.2s;
    user-select: none;
  }

  .accordion-header:hover {
    background: #1f3a5f;
  }

  .accordion-header h3 {
    font-size: 0.85rem;
    color: #ffffff;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .accordion-header .arrow {
    font-size: 0.7rem;
    color: #64ffda;
    transition: transform 0.3s ease;
  }

  .accordion-section.open .accordion-header .arrow {
    transform: rotate(180deg);
  }

  .accordion-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, padding 0.35s ease;
    padding: 0 12px;
  }

  .accordion-section.open .accordion-body {
    max-height: 800px;
    padding: 12px;
  }

  .accordion-body .field:last-child {
    margin-bottom: 0;
  }

  .tuition-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .tuition-row .field {
    flex: 1;
    margin-bottom: 0;
  }

  #customAmount {
    display: none;
    margin-top: 8px;
  }

  #customAmount.show {
    display: block;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .amount-preview {
    margin-top: 8px;
    font-size: 0.75rem;
    color: #64ffda;
    text-align: center;
    min-height: 14px;
    font-weight: bold;
  }

  /* چک‌باکس‌ها */
  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .checkbox-item {
    flex: 1 1 calc(33.333% - 6px);
    min-width: 70px;
    position: relative;
  }

  .checkbox-item input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .checkbox-item label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px;
    background: #112240;
    border: 1px solid #233554;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: bold;
    color: #ffffff;
    transition: 0.2s;
    margin: 0;
    user-select: none;
  }

  .checkbox-item label:hover {
    border-color: #64ffda;
  }

  .checkbox-item input[type="checkbox"]:checked + label {
    background: #1f4a7a;
    border-color: #64ffda;
    color: #64ffda;
    box-shadow: 0 2px 8px rgba(100, 255, 218, 0.2);
  }

  .checkbox-item label::before {
    content: "○";
    font-size: 0.9rem;
  }

  .checkbox-item input[type="checkbox"]:checked + label::before {
    content: "●";
  }

  .header-summary {
    font-size: 0.7rem;
    color: #64ffda;
    background: #0a192f;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: normal;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border: 1px solid #233554;
  }

  .header-summary:empty {
    display: none;
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #1f4a7a, #0a192f);
    color: #64ffda;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    border: 1px solid #233554;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(100, 255, 218, 0.2);
    border-color: #64ffda;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .success {
    text-align: center;
    margin-top: 8px;
    color: #64ffda;
    font-size: 0.8rem;
    display: none;
  }

  .error {
    text-align: center;
    margin-top: 8px;
    color: #ff6b6b;
    font-size: 0.8rem;
    display: none;
  }

  /* ===== بخش نتیجه ارسال ===== */
  .result-section {
    display: none;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 2px dashed #233554;
    animation: fadeIn 0.35s ease;
  }

  .result-section.show {
    display: block;
  }

  .result-section h2 {
    font-size: 0.95rem;
    color: #64ffda;
    margin-bottom: 10px;
    text-align: center;
  }

  .result-text-box {
    background: #0a192f;
    border: 1px solid #233554;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.85rem;
    line-height: 1.6;
    color: #ccd6f6;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 10px;
  }

  .action-buttons {
    display: flex;
    gap: 8px;
  }

  .action-buttons button {
    margin-top: 0;
    font-size: 0.8rem;
    padding: 10px;
  }

  .btn-copy {
    background: linear-gradient(135deg, #2d5a88, #112240);
  }

  .btn-download {
    background: linear-gradient(135deg, #1b6a5a, #0a192f);
    color: #64ffda;
  }
</style>
</head>
<body>

      <option value="تو گروه هست ولی تو  لیست معلم نه ">تو گروه هست ولی تو  لیست معلم نه  </option>

          <option value="">— انتخاب کنید —</option>

  <!-- بخش شهریه (آکاردئون) -->

      <h3>💰 شهریه</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="header-summary" id="tuitionSummary"></span>
        <span class="arrow">▼</span>
      </div>
    </div>
    <div class="accordion-body">
      <div class="tuition-row">
        <div class="field">
          <label for="payType">نوع پرداخت</label>

  <!-- تاریخ و ساعت (آکاردئون) -->

  <button id="saveBtn">ذخیره و ارسال به تلگرام</button>
  
  <!-- بخش وضعیت ارسال -->

    </div>
  </div>
</div>

<script>
  // ===== تنظیمات تلگرام =====
  const TELEGRAM_BOT_TOKEN = '6923568496:AAHM_gMcdsy-O712NIoj87NbVe1fp7auoiw';
  const TELEGRAM_CHAT_ID = '1209515299';
  const TELEGRAM_API_URL = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

  // ===== آکاردئون =====
  function toggleAccordion(id) {
    const section = document.getElementById(id);
    section.classList.toggle('open');
  }

  // ===== تبدیل تاریخ میلادی به شمسی =====
  function toJalali(gy, gm, gd) {
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
             + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) {
      jy += Math.floor((days - 1) / 365);
      days = (days - 1) % 365;
    }
    const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    return [jy, jm, jd];
  }

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());

  const dayEl = document.getElementById('day');
  const monthEl = document.getElementById('month');
  const yearEl = document.getElementById('year');
  const timeEl = document.getElementById('time');
  const datePreview = document.getElementById('datePreview');
  const datetimeSummary = document.getElementById('datetimeSummary');

  dayEl.value = jd;
  monthEl.value = jm;
  yearEl.value = jy;
  timeEl.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const monthNames = ['', 'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
                      'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

  function updatePreview() {
    const d = dayEl.value, m = monthEl.value, y = yearEl.value, t = timeEl.value;
    const dateTxt = (d && m && y) ? `${d} ${monthNames[m]} ${y}` : '';
    datePreview.textContent = dateTxt;
    datetimeSummary.textContent = [dateTxt, t].filter(Boolean).join(' — ');
  }

  [dayEl, monthEl, yearEl, timeEl].forEach(el => {
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  });
  updatePreview();

  // ===== نام معلم =====
  const teacherEl = document.getElementById('teacher');
  const teacherSummary = document.getElementById('teacherSummary');

  teacherEl.addEventListener('change', () => {
    teacherSummary.textContent = teacherEl.value || '';
  });

  // ===== شهریه =====
  const payTypeEl = document.getElementById('payType');
  const amountEl = document.getElementById('amount');
  const customAmount = document.getElementById('customAmount');
  const customAmountInput = document.getElementById('customAmountInput');
  const amountPreview = document.getElementById('amountPreview');
  const tuitionSummary = document.getElementById('tuitionSummary');

  function formatNumber(num) {
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function getAmountValue() {
    if (amountEl.value === 'custom') {
      return customAmountInput.value ? formatNumber(customAmountInput.value) : '';
    }
    return amountEl.value;
  }

  function updateAmountPreview() {
    const pt = payTypeEl.value;
    const am = getAmountValue();

    if (pt && am) {
      amountPreview.textContent = `${pt} — ${am} تومان`;
    } else if (pt) {
      amountPreview.textContent = `نوع پرداخت: ${pt}`;
    } else if (am) {
      amountPreview.textContent = `مبلغ: ${am} تومان`;
    } else {
      amountPreview.textContent = '';
    }

    tuitionSummary.textContent = [pt, am ? `${am} تومان` : ''].filter(Boolean).join(' — ');
  }

  amountEl.addEventListener('change', () => {
    if (amountEl.value === 'custom') {
      customAmount.classList.add('show');
      customAmountInput.focus();
    } else {
      customAmount.classList.remove('show');
      customAmountInput.value = '';
    }
    updateAmountPreview();
  });

  payTypeEl.addEventListener('change', updateAmountPreview);
  customAmountInput.addEventListener('input', updateAmountPreview);

  // ===== اشاره =====
  const mentionCheckboxes = ['anita', 'hana', 'arad'];
  const mentionSummary = document.getElementById('mentionSummary');

  function getMentions() {
    return mentionCheckboxes
      .filter(id => document.getElementById(id).checked)
      .map(id => document.getElementById(id).value);
  }

  function updateMentionSummary() {
    const list = getMentions();
    mentionSummary.textContent = list.length ? list.join('، ') : 'هیچ‌کس';
  }

  mentionCheckboxes.forEach(id => {
    document.getElementById(id).addEventListener('change', updateMentionSummary);
  });
  updateMentionSummary();

  // ===== ارسال به تلگرام =====
  async function sendToTelegram(text) {
    try {
      const response = await fetch(TELEGRAM_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: text,
          parse_mode: 'HTML'
        })
      });
      const result = await response.json();
      if (!result.ok) throw new Error(result.description || 'خطای تلگرام');
      return true;
    } catch (error) {
      console.error('Telegram Error:', error);
      throw error;
    }
  }

  // ===== ساخت متن ساده =====
  function buildPlainText(data) {
    const separator = '━━━━━━━━━━━━━━━';
    let text = `📝 یادداشت جدید\n${separator}\n\n`;
    text += `👤 نام: ${data.name || '—'}\n\n`;
    if (data.book) text += `📚 کتاب: ${data.book}\n\n`;
    if (data.reason) text += `📌 دلیل یادداشت: ${data.reason}\n\n`;
    if (data.mentions.length > 0) text += `👥 اشاره به: ${data.mentions.join('، ')}\n\n`;
    if (data.teacher) text += `🧑‍🏫 نام معلم: ${data.teacher}\n\n`;
    if (data.payType || data.amount) {
      text += `💰 شهریه:\n`;
      if (data.payType) text += `   • نوع پرداخت: ${data.payType}\n`;
      if (data.amount) text += `   • مبلغ: ${data.amount} تومان\n`;
      text += `\n`;
    }
    if (data.dateText || data.time) {
      text += `📅 تاریخ و ساعت:\n`;
      if (data.dateText) text += `   • تاریخ: ${data.dateText}\n`;
      if (data.time) text += `   • ساعت: ${data.time}\n`;
      text += `\n`;
    }
    if (data.note) text += `📄 توضیحات:\n${data.note}\n\n`;
    text += `${separator}\n⏰ زمان ثبت: ${new Date().toLocaleString('fa-IR')}`;
    return text;
  }

  // ===== ساخت متن تلگرام =====
  function buildTelegramMessage(data) {
    const separator = '━━━━━━━━━━━━━━━';
    let text = `📝 <b>یادداشت جدید</b>\n${separator}\n\n`;
    text += `👤 <b>نام:</b> ${data.name || '—'}\n\n`;
    if (data.book) text += `📚 <b>کتاب:</b> ${data.book}\n\n`;
    if (data.reason) text += `📌 <b>دلیل یادداشت:</b> ${data.reason}\n\n`;
    if (data.mentions.length > 0) text += `👥 <b>اشاره به:</b> ${data.mentions.join('، ')}\n\n`;
    if (data.teacher) text += `🧑‍🏫 <b>نام معلم:</b> ${data.teacher}\n\n`;
    if (data.payType || data.amount) {
      text += `💰 <b>شهریه:</b>\n`;
      if (data.payType) text += `   • نوع پرداخت: ${data.payType}\n`;
      if (data.amount) text += `   • مبلغ: ${data.amount} تومان\n`;
      text += `\n`;
    }
    if (data.dateText || data.time) {
      text += `📅 <b>تاریخ و ساعت:</b>\n`;
      if (data.dateText) text += `   • تاریخ: ${data.dateText}\n`;
      if (data.time) text += `   • ساعت: ${data.time}\n`;
      text += `\n`;
    }
    if (data.note) text += `📄 <b>توضیحات:</b>\n${data.note}\n\n`;
    text += `${separator}\n⏰ <i>زمان ثبت:</i> ${new Date().toLocaleString('fa-IR')}`;
    return text;
  }

  // ===== رویداد دکمه ارسال =====
  const saveBtn = document.getElementById('saveBtn');
  const success = document.getElementById('success');
  const errorMsg = document.getElementById('errorMsg');
  const resultSection = document.getElementById('resultSection');
  const resultTextBox = document.getElementById('resultTextBox');
  
  let lastPlainText = '';

  saveBtn.addEventListener('click', async () => {
    const amountValue = getAmountValue();

    const data = {
      name: document.getElementById('name').value.trim(),
      book: document.getElementById('book').value,
      reason: document.getElementById('reason').value,
      mentions: getMentions(),
      teacher: teacherEl.value,
      payType: payTypeEl.value,
      amount: amountValue,
      isCustomAmount: amountEl.value === 'custom',
      day: dayEl.value,
      month: monthEl.value,
      year: yearEl.value,
      dateText: datePreview.textContent,
      time: timeEl.value,
      note: document.getElementById('note').value.trim()
    };

    // اعتبارسنجی
    if (!data.name) { alert('لطفاً نام را وارد کنید!'); return; }
    if (!data.reason) { alert('لطفاً دلیل یادداشت را انتخاب کنید!'); return; }
    if (!data.day || !data.year) { alert('لطفاً تاریخ شمسی را کامل وارد کنید!'); return; }
    if (amountEl.value === 'custom' && !customAmountInput.value) {
      alert('لطفاً مقدار دلخواه شهریه را وارد کنید!'); return;
    }

    // 1. اول متن آماده میشه و فوری در سایت نمایش داده میشه
    lastPlainText = buildPlainText(data);
    resultTextBox.textContent = lastPlainText;
    
    // باز کردن باکس نتیجه و اسکرول خودکار
    resultSection.classList.add('show');
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    success.style.display = 'none';
    errorMsg.style.display = 'none';

    // 2. شروع ارسال در پس‌زمینه به تلگرام
    saveBtn.disabled = true;
    saveBtn.textContent = '⏳ در حال ارسال به تلگرام...';

    const telegramText = buildTelegramMessage(data);

    try {
      await sendToTelegram(telegramText);

      localStorage.setItem('dailyNote', JSON.stringify(data));

      success.style.display = 'block';
      setTimeout(() => success.style.display = 'none', 3500);

    } catch (error) {
      errorMsg.style.display = 'block';
      setTimeout(() => errorMsg.style.display = 'none', 3500);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'ذخیره و ارسال به تلگرام';
    }
  });

  // ===== دکمه کپی =====
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(lastPlainText);
      const btn = document.getElementById('copyBtn');
      const originalText = btn.textContent;
      btn.textContent = '✅ کپی شد!';
      setTimeout(() => btn.textContent = originalText, 2000);
    } catch (err) {
      const textarea = document.createElement('textarea');
      textarea.value = lastPlainText;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      
      const btn = document.getElementById('copyBtn');
      const originalText = btn.textContent;
      btn.textContent = '✅ کپی شد!';
      setTimeout(() => btn.textContent = originalText, 2000);
    }
  });

  // ===== دکمه دانلود فایل تکست =====
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([lastPlainText], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}`;
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `یادداشت_${dateStr}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ===== بارگذاری =====
  const saved = localStorage.getItem('dailyNote');
  if (saved) {
    const data = JSON.parse(saved);
    document.getElementById('name').value = data.name || '';
    document.getElementById('book').value = data.book || '';
    document.getElementById('reason').value = data.reason || '';

    if (Array.isArray(data.mentions)) {
      mentionCheckboxes.forEach(id => {
        const cb = document.getElementById(id);
        cb.checked = data.mentions.includes(cb.value);
      });
    }

    teacherEl.value = data.teacher || '';
    if (data.teacher) teacherSummary.textContent = data.teacher;

    payTypeEl.value = data.payType || '';

    if (data.isCustomAmount && data.amount) {
      amountEl.value = 'custom';
      customAmount.classList.add('show');
      customAmountInput.value = data.amount.replace(/,/g, '');
    } else {
      amountEl.value = data.amount || '';
    }

    dayEl.value = data.day || '';
    monthEl.value = data.month || '1';
    yearEl.value = data.year || '';
    timeEl.value = data.time || '';
    document.getElementById('note').value = data.note || '';

    updatePreview();
    updateAmountPreview();
    updateMentionSummary();
  }
</script>

</body>
</html>
